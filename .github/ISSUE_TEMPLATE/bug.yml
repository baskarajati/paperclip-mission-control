name: Bug report
description: Report a reproducible Mission Control defect
title: "bug: "
labels:
  - bug
body:
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: mission_control_version
    attributes:
      label: Mission Control version
    validations:
      required: true
  - type: input
    id: paperclip_version
    attributes:
      label: Paperclip version
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant sanitized logs
