name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contracts (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["24", "25"]
    steps:
      # Actions are pinned to commit SHAs. Update the SHA and the trailing
      # comment together when a major version is adopted.
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Install pnpm from the pinned packageManager field
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Install Node ${{ matrix.node }}
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run the contract test suite
        run: pnpm test

      - name: Forbid runtime dependencies
        run: |
          node -e '
            const pkg = require("./package.json");
            const names = Object.keys(pkg.dependencies ?? {});
            if (names.length > 0) {
              console.error(
                "AGENTS.md forbids runtime dependencies before architecture approval. Found: " +
                  names.join(", "),
              );
              process.exit(1);
            }
          '

      - name: Reject whitespace errors and conflict markers in the pull request
        if: github.event_name == 'pull_request'
        run: |
          git diff --check \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}"
